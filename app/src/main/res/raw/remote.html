<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鸡仔浏览器 · 手机遥控</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0B0E17;color:#F1F0EB;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px;max-width:480px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
#status{font-size:13px;color:#8B93B0;margin-bottom:16px}
#status.ok{color:#4ade80}#status.err{color:#f87171}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 20px}
.pad button{aspect-ratio:1;border-radius:16px;border:1px solid #232B45;background:#1A2138;color:#F1F0EB;font-size:26px}
.pad button:active{background:#FF385C}
.row{display:flex;gap:10px;margin-bottom:12px}
.row input{flex:1;background:#1A2138;border:1px solid #232B45;color:#F1F0EB;border-radius:12px;padding:14px;font-size:16px;min-width:0}
.row button{background:#FF385C;border:none;color:#fff;border-radius:12px;padding:0 20px;font-size:16px;font-weight:700}
label{font-size:13px;color:#8B93B0;display:block;margin:14px 0 6px}
.hint{font-size:12px;color:#8B93B0;margin-top:20px;line-height:1.8;text-align:center}
</style>
</head>
<body>
<h1>🐤 手机遥控</h1>
<div id="status">连接中…</div>

<div class="pad">
  <span></span><button data-k="DPAD_UP">▲</button><span></span>
  <button data-k="DPAD_LEFT">◀</button><button data-k="ENTER">OK</button><button data-k="DPAD_RIGHT">▶</button>
  <span></span><button data-k="DPAD_DOWN">▼</button><span></span>
</div>
<div class="pad" style="grid-template-columns:1fr 1fr;max-width:300px">
  <button data-k="BACK" style="font-size:18px">↩ 返回</button>
  <button id="homeK" style="font-size:18px">🏠 主页</button>
</div>

<label>在电视上输入文字（手机键盘打字）</label>
<div class="row">
  <input id="txt" placeholder="比如搜索关键词">
  <button id="sendTxt">发送</button>
</div>

<label>在电视上打开网址</label>
<div class="row">
  <input id="url" placeholder="https://…" inputmode="url">
  <button id="sendUrl">打开</button>
</div>

<label>投屏视频到电视（自动全屏播放）</label>
<div class="row">
  <input id="castUrl" placeholder="视频页面地址 https://…" inputmode="url">
  <button id="sendCast">投屏</button>
</div>

<div class="hint">手机和电视需在同一 Wi-Fi（或同一 Tailscale 网络）下<br>方向键也可直接遥控电视端焦点</div>

<script>
const q = new URLSearchParams(location.search);
const wsPort = q.get('ws') || '8090';
const code = q.get('code') || '';
const status = document.getElementById('status');
let ws = null;

function connect() {
  status.textContent = '连接中…'; status.className = '';
  ws = new WebSocket('ws://' + location.hostname + ':' + wsPort);
  ws.onopen = () => ws.send(JSON.stringify({type:'auth', code}));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'authed') { status.textContent = '● 已连接，可以遥控了'; status.className = 'ok'; }
    if (m.type === 'auth_failed') { status.textContent = '配对码错误，请重新扫码'; status.className = 'err'; }
  };
  ws.onclose = () => { status.textContent = '连接断开，3 秒后重连…'; status.className = 'err'; setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
}
document.querySelectorAll('[data-k]').forEach(b => {
  b.onclick = () => ws && ws.send(JSON.stringify({type:'key', key:b.dataset.k}));
});
document.getElementById('homeK').onclick = () => ws && ws.send(JSON.stringify({type:'key', key:'HOME'}));
document.getElementById('sendTxt').onclick = () => {
  const v = document.getElementById('txt').value;
  if (v && ws) ws.send(JSON.stringify({type:'text', text:v}));
};
document.getElementById('sendUrl').onclick = () => {
  const v = document.getElementById('url').value.trim();
  if (v && ws) ws.send(JSON.stringify({type:'open', url:v}));
};
document.getElementById('sendCast').onclick = () => {
  const v = document.getElementById('castUrl').value.trim();
  if (v && ws) ws.send(JSON.stringify({type:'cast', url:v}));
};
connect();
</script>
</body>
</html>
