name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 打包 debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jizai-tv-browser.apk

      - name: 上传 APK（构件保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: jizai-tv-browser-debug
          path: jizai-tv-browser.apk
          retention-days: 30

      - name: 发布到 latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: main 分支最新自动构建，下载后直接安装。
          files: jizai-tv-browser.apk
